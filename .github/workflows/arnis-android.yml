name: Build Arnis Android APK (experimental)
on:
  workflow_dispatch:
  push:
    branches: [arnis-android-port]
    paths:
      - '.github/workflows/arnis-android.yml'
      - 'arnis-android/**'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Download Arnis 3.3.0 source
        run: |
          curl -fL --retry 3 https://github.com/louis-e/arnis/archive/refs/tags/v3.3.0.tar.gz -o arnis.tar.gz
          mkdir arnis-src
          tar -xzf arnis.tar.gz -C arnis-src --strip-components=1
      - name: Use bundled WebPKI roots on Android
        working-directory: arnis-src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Cargo.toml")
          s=p.read_text()
          old='reqwest = { version = "0.13.1", features = ["blocking", "json", "query", "gzip"] }'
          new='reqwest = { version = "0.13.1", default-features = false, features = ["blocking", "json", "query", "gzip", "rustls", "webpki-roots"] }'
          assert old in s, "reqwest dependency not found"
          p.write_text(s.replace(old,new))
          PY
          cargo update -p reqwest --precise 0.13.3 || cargo update -p reqwest
      - name: Build Android ARM64 native engine
        working-directory: arnis-src
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android35-clang
          cargo build --release --target aarch64-linux-android --no-default-features
      - name: Package executable as extractable native library
        run: |
          mkdir -p arnis-android/app/src/main/jniLibs/arm64-v8a
          cp arnis-src/target/aarch64-linux-android/release/arnis arnis-android/app/src/main/jniLibs/arm64-v8a/libarnis.so
      - name: Build debug APK
        working-directory: arnis-android
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: arnis-android-arm64-debug-apk
          path: arnis-android/app/build/outputs/apk/debug/*.apk

name: Build DS4 Vibration APK
on:
  push:
    branches: [ds4-vibration-control]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ds4-vibration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DS4VibrationControl-debug-APK
          path: ds4-vibration/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

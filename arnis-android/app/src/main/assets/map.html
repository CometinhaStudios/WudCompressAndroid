<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}#hint{position:absolute;z-index:999;top:10px;left:10px;right:10px;background:#fff;padding:10px;border-radius:9px;font:14px sans-serif;box-shadow:0 2px 8px #777}#cross{position:absolute;z-index:800;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;pointer-events:none;color:#d22}</style></head><body><div id="map"></div><div id="hint">Mova o mapa e toque em Selecionar area no aplicativo</div><div id="cross">+</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
var map=L.map('map').setView([-1.1967,-47.1817],15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
var rectangle=null;
function selectArea(){var b=map.getBounds(),c=map.getCenter(),dy=(b.getNorth()-b.getSouth())*.18,dx=(b.getEast()-b.getWest())*.18;var s=L.latLngBounds([c.lat-dy,c.lng-dx],[c.lat+dy,c.lng+dx]);if(rectangle)map.removeLayer(rectangle);rectangle=L.rectangle(s,{color:'#00a86b',weight:3,fillOpacity:.18}).addTo(map);Android.onBounds(s.getSouth().toFixed(6)+','+s.getWest().toFixed(6)+','+s.getNorth().toFixed(6)+','+s.getEast().toFixed(6));}
async function search(q){try{var r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));var j=await r.json();if(j.length){map.setView([+j[0].lat,+j[0].lon],15)}else{alert('Local nao encontrado')}}catch(e){alert('Falha na busca: '+e)}}
</script></body></html>

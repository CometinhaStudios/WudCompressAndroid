plugins { id 'com.android.application' }

android {
    namespace 'br.com.cdecryptmobile'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.cdecryptmobile'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2-beta'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cFlags '-std=c99 -D_GNU_SOURCE -DAES_ROM_TABLES' } }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
